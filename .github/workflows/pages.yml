# Publish the site to GitHub Pages: https://electrucio.github.io/parts-index/
#
# The build reads only what is committed under data/ (a test sabotages the private root to prove it), so
# the runner builds the same site as `make web` on the maintainer's machine. The 263 MB of part pages
# travel as a deployment artifact and never enter git: every deploy replaces the previous one whole.
# Started by hand (`make web-deploy`, or the Run workflow button), not on every push: the data commits
# are many and the site is rebuilt at milestones. The Pages site itself was created once, by an
# administrator, with `gh api -X POST repos/electrucio/parts-index/pages -f build_type=workflow`: the
# workflow's token may deploy to it but may not create it (done 2026-09-26).
#
# The data-sheet crops (CLAUDE.md rule 1: a table row or a graph, beside our reading of it) are made from
# the PDFs on the maintainer's machine, which the runner never has. They travel as one release asset,
# `crops.tar` on the release `datasheet-crops`, and are unpacked into the built site; without the asset
# the site is built all the same, with page links instead of crops. Deleting the asset withdraws them.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
      - run: cd web && npm ci --no-fund --no-audit
      - run: make web
      - name: data-sheet crops, if published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download datasheet-crops --repo "$GITHUB_REPOSITORY" --pattern crops.tar --dir "$RUNNER_TEMP"; then
            mkdir -p web/dist/data && tar -xf "$RUNNER_TEMP/crops.tar" -C web/dist/data
          else
            echo "no crops asset: the site shows page links instead"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
