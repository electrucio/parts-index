# Reference values for the datasheet-extraction experiments: what the electrical-characteristics tables of
# 20 manufacturer data sheets say, read row by row off the rendered page images (150 dpi) and typed in by
# Claude on 2026-09-28 — not yet checked by the maintainer. Values are as printed (signs, units, even the
# sheets' own mistakes, marked "sic"); only the rows a SPICE bench can use were taken, plus the ones that
# test the hard parts of extraction (several parts or grades in one table).
#
# row: [symbol, conditions, min, typ, max, unit, (variant)]   — null where the sheet prints a dash.
# pdf: path under the private data-sheet store (private_material/datasheets/vendor/); url from its manifest.

