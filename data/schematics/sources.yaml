    origin: community
  notes: 'DrJ3RK and schema-cave publish their schematics as PDF and no CAD at all — 105 files between
    them — so `.pdf` is in `ext` and `keep` says which PDF is a schematic rather than a datasheet or a
    build note. It costs the `.brd` files, whose paths do not say "sch"; they carry no part fields this
    pipeline can read anyway.

    A list a person keeps beats a list a topic makes. eurorack-awesome names fifty-six
    repositories chosen by somebody who builds these; the topic sweep finds five hundred and fifty-four
    of mixed worth. Measured on 2026-09-25: 38 of the 56 hold CAD, 440 files and 100 PDFs between them,
    with pichenettes/eurorack (Mutable Instruments) at 70 and CATs-Eurosynth at 63.

    `repos` are the ones sdiy.info names and the list does not: GroundGrown alone has 112 CAD files and
    QuinnFreedman 50, while DrJ3RK and schema-cave publish their schematics as PDF rather than as
    sources. `skip` is the other half of reading somebody else''s list — it links KiCad and FreeCAD
    themselves, and KiCad''s tree holds hundreds of .kicad_sch demonstration files that no one built.'
