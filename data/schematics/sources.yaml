circuitsnips:
  kind: site
  title: CircuitSnips (shared KiCad subcircuits)
  home_url: https://circuitsnips.com/
  status: excluded
  era: modern
  notes: '4,311 KiCad subcircuits on 2026-09-25, each with a described function, a category, tags and a
    licence, enumerable over its own /api/search. Excluded because it is derivative and we can take the
    original: of a hundred "amplifier" results sampled, a hundred were re-imports from GitHub
    repositories, each carrying the attribution that says so. The `openhw_*` sources reach those same
    designs whole rather than in fragments.

    Worth remembering for something else. Every snippet carries a sentence saying what the circuit does
    — "dual low-power op-amp configured for single-supply operation" — which is exactly what `summarise`
    produces by asking a model. That makes it a test set for that stage, written by people, and this is
    the note to come back to when that stage needs one.'
