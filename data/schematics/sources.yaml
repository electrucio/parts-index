    kind: application_note
  notes: 'Application notes are schematics with real part numbers in them, and the same vendor vouches
    for the SPICE models, which makes this the companion of pillar 2. robots.txt allows the document
    paths, asks for Crawl-delay 1, and names the sitemap index that led here — /sitemap.xml is a 404
    and the real one is written down only in robots.txt. Downloaded whole on 2026-09-25: 8,841 of
    8,841, 9.7 GB, from a literature sitemap of 69,513 documents. `keep` takes the analog application
    notes (sboa amplifiers, sbaa converters, sloa/snoa analog, snva/slva/slua power, slyt the design
    journal), the TIDA reference design guides, and the evaluation-module user guides, which carry the
    board''s own schematic; it leaves the marketing bulletins, the processor and wireless manuals, and
    the data sheets, which are a category of their own. Every file is born digital and carries a text
    layer, so it needs no OCR engine at all. Read on 2026-09-25 it gives 7,805 parts, 6,974 of them new
    to the index and 4,824 from families newer than 1995 — the whole corpus held 291 of those before.'
toragi:
  kind: magazine
  title: トランジスタ技術 (Transistor Gijutsu, CQ出版社) — the free sample pages, 2004 onwards
  home_url: https://toragi.cqpub.co.jp/magazine/
  status: active
  ocr:
    lang: japan
  era: modern
  list:
    role: sample
    delay: 2
  toragi:
    since: 2004
  notes: 'The Japanese monthly, 1964 to date, whose modern years are the analogue and mixed-signal
    material this corpus is emptiest in. Measured on 2026-09-25. The site is WordPress and says so
    in the one place that counts: robots.txt disallows /wp-admin/ and nothing else. Its media API
    lists every upload — 4,342 PDFs, 192 ZIPs — in 44 requests, so nothing here is guessed from a
    file name. 4,233 of the PDFs hang off one of the 274 issue pages (/magazine/YYYYMM/, 2004-01 to
    2026-10, twelve a year), and 109 hang off nothing; the `magazine` endpoint maps a parent post
    to its YYYYMM. 3,252 of the PDFs were uploaded in 2022, which is the migration of the old
    TRBN pages (see toragi_trbn) and will duplicate them byte for byte.

    What a sample is: the first page or two of an article (2026-4-p037-038.pdf), about 1 MB, one per
    article, seventeen to twenty an issue, plus the table of contents, the English digest and the
    corrections (teiseiYYYYMM.pdf, /teiseiYYYY/, /category/correction/). Never the whole article.
    The file name carries the start page and, since 2025, the issue; the issue for the older ones
    comes from the parent post, and the article title from TR.txt — the publisher''s own index of
    20,054 articles in 738 issues, CP932 CSV, shipped free in TRDBWin25.zip and kept private.

    The ZIPs under /downloadYYYY/ (2010 to 2026) are program sources for the articles. They are
    listed with their issue and left unopened: a sketch is not a document read for its circuit.
    The ones that turn out to hold KiCad or EAGLE files can be opened later with cad.py.

    Tech Village (cc.cqpub.co.jp, no robots.txt) sells the full PDFs and shows each issue''s table
    of contents, but its item pages carry no sample link — only a link back here. It is a
    catalogue, not a source, and is not listed. The plan with every measurement is in the
    maintainer''s notes (toragi-cq-corpus).

    Listed on 2026-09-26: 4,739 rows — 4,108 samples, of which 3,946 have their row in TR.txt, 74
    tables of contents, 59 supplements, 52 corrections, 16 digests, 396 program archives recorded
    and not fetched, 40 with no issue at all. About seventeen samples an issue from 2010 on, and
    roughly one article in two has one: the short columns do not. The server hands a PDF over at
    about 70 KB/s whatever the client, so the 4 GB take some thirteen hours at one request every
    two seconds; that is its pace and it is kept.

    Stopped by choice on 2026-09-26 with 2,043 PDFs held (1.6 GB), 2026-10 back to about 2020.
    Measured over what was held, two samples in a hundred show anything like a schematic: the
    circuit is on the pages CQ sells. The schematics CQ gives away are in toragi_support and
    toragi_zips, and that is where the effort went. The ledger keeps every row, so the same
    download command resumes where this stopped if the samples are ever wanted for their text.'
toragi_support:
  kind: magazine
  title: トランジスタ技術 support material — the appendix boards and projects, whole, 2008–2021
  home_url: https://toragi.cqpub.co.jp/Portals/0/support/
  status: active
  ocr:
    lang: japan
  era: modern
  list:
    role: support
    delay: 2
  toragi_support: {}
  notes: 'Where the schematics are. A sample is the first page of an article and the circuit is on
    the pages CQ sells; what it published whole is the support material of its appendix boards and
    featured projects — circuit.pdf, pisoc_sch.pdf, the LV-1 headphone amplifier and DAC, a
    full-digital RF transceiver in ten sheets — under Portals/0/support/ and Portals/0/download/ on
    the current host and, mirrored, under toragi/2008-2020/Portals/0/ on the old one. That is the
    DotNetNuke tree of 2008 to 2021, and no page indexes it any more. The Wayback Machine''s CDX
    index names every file it captured there, 2,110 files in 550 MB on 2026-09-26 — 346 PDFs, 87
    ZIPs, the rest photographs — and the six checked were all still served live by CQ. So the list
    comes from the archive''s index and the files come from CQ; a file CQ no longer serves is listed
    again from the archive, by capture date, on the next run. Photographs are left out by name and
    the board/ folders too: the LV-1 tree keeps its schematics under circuit/ and its copper under
    board/. The ZIPs are listed and not fetched here; they are opened separately, since one in ten
    holds the schematic as a PDF or a CAD file.'
toragi_zips:
  kind: delivery
  title: トランジスタ技術 program archives, opened for the schematics inside
  home_url: https://toragi.cqpub.co.jp/download2026/
  status: active
  ocr:
    lang: japan
  era: modern
  delivery:
    role: support
    link:
    - match: '(?i)^([^!]+\.lzh)\.zip!'
      url: 'https://{1}'
    - match: '^([^!]+\.zip)!'
      url: 'https://{1}'
  notes: 'The ZIPs under /downloadYYYY/ and the old support trees are the programs that go with the
    articles, and about one in ten also carries the circuit — as a PDF drawn from the CAD, sometimes
    the CAD source itself. They are fetched by hand to the scratch area, opened, and packed again with
    only the members worth holding, each under the path of its public URL, so the link rule above
    turns the member key back into the archive CQ serves. Sources, binaries and screenshots stay out.

    The old download archive (1997–2008, www.cqpub.co.jp/toragi/download/) is 462 more, 243 MB,
    listed from the Wayback index and still served by CQ; most are LHA. One in eight of a first
    sample carried OrCAD/PSpice designs, .DSN with the .net and .cir netlists beside them, which
    name every part and its model in plain text. An LHA archive is repacked as a ZIP, so its key
    ends .lzh.zip and the first link rule strips that back to the URL.'
toragi_trbn:
  kind: magazine
  title: トランジスタ技術 back numbers on the old CQ site, 1997–2008
  home_url: https://www.cqpub.co.jp/toragi/TRBN/html/backnumber.htm
  status: active
  ocr:
    lang: japan
  era: mixed
  list:
    role: sample
    delay: 2
  toragi_trbn: {}
  notes: 'The previous generation of the same thing, still served. robots.txt forbids /script/,
    /search/ and /shared/ and nothing under /toragi/. backnumber.htm (CP932) links one page per
    issue, TRBN/contents/YYYY/TRYYYYMM.htm for 1998 to 2008 (upper-case .HTM in 1998 and 1999),
    and each page links its sample PDFs under contents/YYYY/trYYMM/ — 17 for 2005-01, one checked
    at 281 KB and application/pdf. The download archive is behind two frames,
    download/html/dl_frame.htm → dl_year.htm (1997 to 2008) and download.htm, 390 article pages
    with their files. Whatever 2004–2008 shares with the WordPress uploads of 2022 is the same
    bytes under two URLs: both are kept, and the report says so by sha256. The tabid CMS of
    2008–2020 (toragi/2008-2020/tabid/92/Default.html) links only navigation, banners and CSS
    under Portals/0/; it is followed where linked and never enumerated.

    Done on 2026-09-26: 1,031 PDFs held, 270 MB, every one distinct, one 404. The sample PDFs
    begin in August 2002 — the 1998–2001 pages list the articles and link nothing — so it is 61
    for 2002, 151 for 2003 and 160 to 200 a year for 2004 to 2007, about the same count as the
    WordPress copies of those years. 903 of the 1,032 links had a title beside them on the page,
    and 829 have their row in TR.txt, by start page where the name carries one (p113-114.pdf) and
    by title where it does not (0501sp1.pdf).'
