    .sch between them on 2026-09-24. It was left proposed while a filter for digital breakouts was
    wanted, and on 2026-09-25 that turned out to be the wrong place to filter: a path pattern cannot see
    whether a board has an analogue chain on it, and the thing that can is the extractor. A breakout with
