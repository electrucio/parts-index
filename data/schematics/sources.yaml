  kind: factory
  title: MikroElektronika Click boards
  home_url: https://www.mikroe.com/click
  status: blocked
  era: modern
  blocked_reason: 'robots.txt names about thirty agents that may read it and gives `User-agent: *` a
    flat Disallow: /'
  notes: 'Roughly 1,500 add-on boards, each with its own schematic, and heavily analogue — current
    sense, ADCs, amplifiers, sensor front ends. On volume and on subject it would have been one of the
    best modern sources in this registry.

    It says no, and how it says it is worth recording. Its robots.txt lists some thirty agents that may
    crawl public content — Googlebot, bingbot, GPTBot, ClaudeBot, Claude-User, Claude-SearchBot among
    them — and then gives `User-agent: *` a flat `Disallow: /`. We are not ClaudeBot: this is a personal
    indexer run by one person, so the group that applies to us is `*`, and `*` is refused. Putting a
    name from the allow-list in our User-Agent to get in is precisely the disguise rule 3 forbids, so
    this is blocked rather than argued with.

    Checked on 2026-09-25. Asking them is the way in, and they publish an llms.txt, which suggests they
    have thought about readers of this kind.'
