    kind: application_note
  notes: 'robots.txt names ClaudeBot and anthropic-ai and allows them both, with a policy at
    renesas.com/llms.txt: of every manufacturer checked on 2026-09-24 the only one that says yes to this
    by name. Its sitemap lists 8,783 application notes, white papers and manuals.

    Measured on 2026-09-25, and the reason rule 3 now tells a refusal from a complaint about pace: 411
    documents came without a word, then Cloudflare answered 429 with `cf-mitigated: challenge` across
    the whole site, the front page included. Slowing from one request every three seconds to one every
    six changed nothing, so it was not the per-request pace alone — the morning had also walked its 118
    sitemaps three times over, about a hundred megabytes of XML, and the third walk was avoidable. The
    challenge cleared on its own in about seventy-five minutes. It was never a withdrawal of permission.

    Resumed at one request every fifteen seconds, and the sitemaps are cached now, so a re-list costs
    nothing. If it trips again the next pace to try is thirty seconds, then an hour of the day when
    nothing else of ours is running.'
