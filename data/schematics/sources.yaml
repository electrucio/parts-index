archive_databooks:
  kind: reference
  title: Semiconductor databooks (bitsavers mirror on archive.org)
  home_url: https://archive.org/details/bitsavers
  status: proposed
  notes: '1,040 databook items on 2026-09-22. Wanted for two things at once: the numerical index pages are
    the semiconductor half of data/parts/census.csv, and the book itself is a reference a search can link
    to when no schematic uses the part. The 1982 D.A.T.A. Book Transistor Edition
    (bitsavers_derivationates1982DATABookTransistorEdition53Volum_111125681) is open and already carries a
    _djvu.txt, so it needs no OCR pass at all.'
archive_instruments:
  kind: reference
  title: Test and instrumentation manuals (bitsavers mirror on archive.org)
  home_url: https://archive.org/details/bitsavers
  status: proposed
  notes: 'Oscilloscope, generator and meter manuals: discrete analogue design, thoroughly archived, sharing
    almost all of its vocabulary with audio. 565 Tektronix items on 2026-09-22. Go through the archive.org
    mirror, never bitsavers.org directly — that host answers 403 to robots.txt, which core.http reads as
    "everything disallowed", and it is right to.'
archive_service_manuals:
  kind: factory
  title: Service manuals on archive.org
  home_url: https://archive.org/
  status: proposed
  notes: 'Hi-fi and pro-audio service manuals held as open archive.org items, reached through the same
    metadata API the Elektor work used, with per-page deep links. Counted on 2026-09-22 with deliberately
    naive queries: 721 items under subject "service manual" for amplifier/receiver/tuner, 167 by title for
    Sansui, Pioneer, Marantz, Technics and Luxman together. The Elektor lesson says a proper sweep by
    title, subject and identifier pattern finds several times that. Brings the solid-state hi-fi vocabulary
    the corpus is thinnest in (2SC3334, KSA1220, 2SK1298 are all absent today). Proposed: set active and
    write its lister.'
audiocircuit:
  kind: factory
  title: AudioCircuit
  home_url: https://audiocircuit.dk/
  status: active
  list:
    role: schematic
  notes: '11,791 factory PDFs over 357 brands, their URLs gathered on 2026-09-18. robots.txt allows
    everything and the site publishes a sitemap, which is how the list is refreshed when it ages.
    Re-checked on 2026-09-22: six files taken at random all answered, averaging 623 KB.'
