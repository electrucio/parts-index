archive_instruments:
  kind: reference
  title: Test and instrumentation manuals (bitsavers mirror on archive.org)
  home_url: https://archive.org/details/bitsavers
  status: proposed
  notes: 'Oscilloscope, generator and meter manuals: discrete analogue design, thoroughly archived,
    sharing almost all of its vocabulary with audio. 565 Tektronix items on 2026-09-22. The claim that
    bitsavers.org must be avoided was wrong on both halves and is corrected here on 2026-09-24: it
    answers 301 to robots.txt, not 403, and serves an 84 MB databook at 200 — and a non-200 robots.txt
    does not mean "disallowed" anyway. RFC 9309 leaves a crawler free after a 4xx, and core.http already
    parses any non-200 reply as an empty robots.txt, which allows everything. Either host will do; the
    archive.org mirror is still the kinder one, being built to be read by machines.'
archive_service_manuals:
  kind: factory
  title: Service manuals on archive.org
  home_url: https://archive.org/
  status: proposed
  notes: 'Hi-fi and pro-audio service manuals held as open archive.org items, reached through the same
    metadata API the Elektor work used, with per-page deep links. Counted on 2026-09-22 with deliberately
    naive queries: 721 items under subject "service manual" for amplifier/receiver/tuner, 167 by title for
    Sansui, Pioneer, Marantz, Technics and Luxman together. The Elektor lesson says a proper sweep by
    title, subject and identifier pattern finds several times that. Brings the solid-state hi-fi vocabulary
    the corpus is thinnest in (2SC3334, KSA1220, 2SK1298 are all absent today). Proposed: set active and
    write its lister.'
