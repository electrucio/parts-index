nonlinearcircuits:
  kind: site
  title: Nonlinear Circuits (eurorack modules, schematics published)
  home_url: https://www.nonlinearcircuits.com/
  status: proposed
  era: mixed
  notes: 'Andrew Fitch publishes the schematic of every module. Registered proposed rather than crawled
    because nobody has walked it yet, not because of any doubt about permission.

    On permission there is a trap worth writing down. Its robots.txt is the Squarespace template, which
    opens with a list of some thirty AI agent names — anthropic-ai and ClaudeBot among them — and looks
    exactly like a refusal. It is not: the names run straight into `User-agent: *` with no rule in
    between, so under RFC 9309 they are one group, and the rules that follow are the ordinary
    Squarespace path exclusions (/search, /api/, /config). Content is allowed. `http.allowed()` reads
    this correctly as it stands; the eye does not. Checked 2026-09-25.'
ohwr:
  kind: site
  title: Open Hardware Repository (CERN)
  home_url: https://ohwr.org/
  status: blocked
  era: modern
  blocked_reason: 'every design file is on gitlab.com, whose robots.txt disallows /api/v*, /*/uploads/
    and /*/*.git/*'
  notes: '190 projects on 2026-09-25, 27 of them tagged analogue: 32-bit ADC front ends, ultra-low-noise
    amplifiers, a high-voltage FMC card, a 24-bit 8-channel acquisition board. Precision analogue of a
    grade nothing else in this registry has.

    The git repositories hold exactly one file, a .ohwr.yaml manifest. The design files are attachments
    on each project wiki, and gitlab.com refuses all three ways to them: the API (Disallow: /api/v*),
    the attachments themselves (Disallow: /*/uploads/) and cloning the wiki over HTTP (Disallow:
    /*/*.git/*). The wiki pages are readable and the files they name are not. That is a refusal and not
    a matter of pace — no delay turns it into a yes — so rule 3 says blocked, and says to keep the link
    a person can follow, which is the project page on ohwr.org.

    The way in is to ask, and it is a good bet: every .ohwr.yaml carries a maintainer name and a CERN
    address, the projects are published under CERN-OHL, and reuse is the whole purpose of the registry.
    That is a letter to write, not a request to make more slowly.'
