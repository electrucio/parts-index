# Registry of schematic/reference sources. status: proposed | active | paused | blocked | excluded
# Add a site here (status: proposed) to have it crawled; its progress is in state/<id>.csv and STATUS.md.
#
# What belongs here is a document read for its circuits: a schematic, or one where the schematic is the
# point of it. A service manual qualifies; a user manual does not, and radiomanual was 69% user manuals
# by weight before its deny pattern said so.
#
# A data sheet does not belong here either, and for a different reason. It is not a worse document, it
# is another kind: it says what a part is, not what anyone built with it. The census already holds one
# per part and links it — that is where a reader who wants the data sheet is sent. This pillar answers
# the other question, "where is this part actually used", and a document is worth its place here only
# if it helps answer that. 13,749 Renesas data sheets were kept out on 2026-09-25 on this ground; they
# are a category to work with later, on their own terms.
#
# `era` is measured, not judged: a source is modern where 8% or more of the parts it has published
# belong to a family newer than 1995, mixed above 2.5%, vintage below. See `pidx status`.
abeltronics:
  kind: factory
  title: Abeltronics
  home_url: https://www.abeltronics.co.uk/
  status: active
  crawl:
    start:
    - https://www.abeltronics.co.uk/products/
    allow: '^/(products|pdf)/'
    max: 0
    complete: true
  notes: 'Crawled to the end on 2026-09-25: 92 pages, 31 PDFs and 467 photographs. The /diagrams.php
    the catalogue named is a 404; what it has hangs off /products/ and /pdf/.'
adi_wiki_eval:
  kind: factory
  title: Analog Devices eval-board wiki (evaluation board schematics and user guides)
  home_url: https://wiki.analog.com/resources/eval/user-guides/
  status: blocked
  era: modern
  blocked_reason: 'its robots.txt disallows every Claude and AI agent name outright, while allowing *'
  notes: 'A clean index of ADI evaluation boards, each with its schematic, BOM and layout — the modern
    analogue material this corpus is emptiest in, and exactly what the reference-design plan wanted.

    It is refused, and refused in the one place a site has for saying so. Its robots.txt gives
    `User-agent: *` everything but /_export/, and then names anthropic-ai, ClaudeBot, Claude-Web,
    Claude-User, Claude-SearchBot, GPTBot, CCBot, PerplexityBot and twenty more with `Disallow: /`.
    That is not a complaint about pace, which rule 3 now tells apart: it is a site allowing ordinary
    crawlers and refusing this kind of reader by name, and no delay makes it into a yes.

    Checked on 2026-09-25. Worth re-reading in a year — a robots.txt is a sentence, not a law, and
    sites change theirs. analog.com itself is a separate matter: it does not answer this machine at
    all (HTTP/2 INTERNAL_ERROR, then timeout), which is a technical block and not a refusal.'
adi_eval:
  kind: delivery
  title: Analog Devices circuit notes and evaluation-board guides, fetched by hand
  home_url: https://www.analog.com/en/resources/reference-designs/circuits-from-the-lab.html
  status: active
  era: modern
  list:
    role: application_note
  delivery:
    role: application_note
    link:
    - match: '^CN/[Cc][Nn]-?(\d+)\.pdf$'
      url: 'https://www.analog.com/media/en/reference-design-documentation/reference-designs/CN{1}.pdf'
    - match: '^UG/.*?(UG-\d+)\.pdf$'
      url: 'https://www.analog.com/media/en/technical-documentation/user-guides/{1}.pdf'
  notes: 'The examples of use that adi_wiki_eval would have given, fetched in a browser by the maintainer
    instead: ADI refuses this by name in robots.txt and permits `User-agent: *` everything, and a person
    in Chrome is that visitor. Hand-picked, never enumerated — 23 documents chosen against the 483 ADI
    parts the census knows and no document in this corpus uses. Circuit notes (CN0xxx) are complete
    application circuits with measured results; evaluation-board user guides (UG-xxx) carry the board''s
    own schematic and BOM. Delivered 2026-09-25.

    The link patterns are written from the file names and are unverified: analog.com does not answer this
    machine at all, so nothing here could check that a CN number maps to that media path. Check one by
    hand before trusting the links, or correct them.'
