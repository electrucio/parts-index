diyaudio:
  kind: forum
  title: diyAudio (attachments only)
  home_url: https://www.diyaudio.com/
  status: active
  list:
    role: schematic
    delay: 5
  notes: 'Active since 2026-09-25, as a list of attachment URLs and not a crawl. The thread pages are
    behind a browser check that this project does not answer; the attachments themselves are served to a
    plain request, and robots.txt still allows everything, so only attachments are fetched, at one
    request every five seconds. The list came out of a labelled pass over 16,792 threads (an LLM read
    the first post, the sampled replies and the attachment names): 2,651 threads present an electronics
    project whose schematic is posted or linked, and from those only the author''s attachments whose
    names say schematic, circuit, LTspice or document. Images with meaningless names are a later list,
    to be sorted by count_designators() after download. Speaker projects and PCB-only threads are out.

    History. Forums were out of scope until 2026-09-22, when the maintainer reversed it: the Pass Labs
    subforum alone carries Nelson Pass''s own project PDFs, and none of them is held — 2SA992 is on one
    document here, and the DIY Front End 2022 sheet that uses it is not among them. The reversal comes
    with his rule, and it is the whole of the entry: **index the attachments, never the conversation**,
    and among attachments only schematics or projects worked out to some degree — not breadboard photos,
    not measurement plots without a circuit, not chat. The signals for that already exist and are
    measured, not guessed: count_designators() and count_values() in core.parts say whether a page has a
    circuit on it, and core.adfilter drops the rest. A thread page is fetched to find what it links to
    and is never itself a document. robots.txt on 2026-09-22 is "Allow: /" with a sitemap, so nothing is
    being worked around. Proposed: needs its own crawler (attachment links, not thread text), a labelled
    sample to set the "worked out" threshold, and the maintainer''s go on the scale before it runs.'
