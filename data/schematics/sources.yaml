  kind: reference
  title: Figures from the CI2N dataset, credited to their papers
  home_url: https://github.com/LAD021/ci2n_datasets
  status: active
  notes: 'Hand-added on 2026-09-24, one figure. The dataset annotates no text, so 200 of its images whose
    Labelme imagePath names the source paper were read with the project OCR; one real part number came out
    (2SC5007) and was checked by eye. The document is the paper, by the DOI Crossref gave for the title;
    its page links to the figure in the dataset repository, pinned to a commit, because that is where a
    reader sees the part. Not worth reading the rest: see data/datasets/registry.yaml.'
