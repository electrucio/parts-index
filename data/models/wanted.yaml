# The parts the model curation looks for: devices common in audio amplifiers (solid state
# and valve), guitar/instrument amplifiers and effect pedals. Written by hand; the lists
# generated from shops, databooks and documents are in data/parts/wanted.csv.
#
# priority: 1 = everywhere, 2 = common, 3 = worth having.
# Each entry: part, priority, aliases, complement, note, stand_in.
# aliases  = other names of the same part (packages, second sources with the same die).
# stand_in = models of other, declared-equivalent parts, used only when the part has no
#            model of its own; the note says why they are equivalent. Candidates found
#            this way are labelled stand-in and verified against this part's datasheet.
# The top-level key is the part's kind; `non_native` lists components drawn in components/.

