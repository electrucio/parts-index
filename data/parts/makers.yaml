# The organisations behind the parts: who designed, made or still documents them, where each is based,
# and the dated events — acquisitions, mergers, spin-offs — that explain why a part designed by one
# company is sold today under another's name.
#
# Fields
#   name        the name the site shows
#   aliases     other spellings, lower case, as the model curation writes a datasheet's maker
#               ("fairchild", "nxp") — the part before any parenthesis is matched against these
#   country     where the organisation is (or was) headquartered — never where a given part was made,
#               which needs evidence about that part. `hq_as_of` is the date the source was read.
#   founded     year
#   events      [year, what happened, the other organisation (an id here when there is one), source]
#   source      the page the country and founding year were read from: an S id of references.csv, or
#               a URL. A fact without a source is left out rather than written from memory.
#
# Read on 2026-09-27. Wikipedia is a secondary source and is cited as such; the organisations' own pages
# are cited where they were read. No prefix is attributed to a maker here yet (LM to National, NE to
# Signetics): the sources read so far do not state them, and a prefix is a habit, not a registration.

