# Pro Electron: the European code for discrete semiconductors, as Philips printed it in its 1987 data
# handbooks (S15, pages 11-12). Two letters and a serial number; the letters say what the device is made of
# and what it was designed for, the serial number says nothing.
label: Pro Electron
summary: European type numbers for discrete semiconductors, registered since 1966.
order: 10
applies_to: [bjt, bjt-ge, jfet, mosfet, diode, diode-ge, zener, led, opto]
forms:
  - example: BC548B
    pattern: '^(?P<material>[ABCR])(?P<function>[A-HLNPQRSTUXYZ])(?P<serial>[1-9]\d{2})(?P<grade>[A-Z]{0,2})$'
  - example: BCY70
    pattern: '^(?P<material>[ABCR])(?P<function>[A-HLNPQRSTUXYZ])(?P<range>[A-Z])(?P<serial>[1-9]\d{1,2})(?P<grade>[A-Z]{0,2})$'
  - example: BZX55C5V6
    pattern: '^(?P<material>[ABCR])(?P<function>Z)(?P<range>[A-Z]?)(?P<serial>[1-9]\d{1,2})-?(?P<tolerance>[A-E])(?P<vz>\d{1,3}V\d{0,2}|\d{1,3})$'
  - example: BC327-25
    pattern: '^(?P<material>[ABCR])(?P<function>[A-HLNPQRSTUXYZ])(?P<range>[A-Z]?)(?P<serial>[1-9]\d{1,2})-(?P<group>\d{2,3})$'
fields:
  material:
    label: material
    values:
      A: germanium (or another material with a band gap of 0.6 to 1.0 eV)
      B: silicon (band gap 1.0 to 1.3 eV)
      C: gallium arsenide (band gap 1.3 eV or more)
      R: compound material, such as cadmium sulphide
  function:
    label: designed for
    values:
      A: diode — signal, low power
      B: diode — variable capacitance
      C: transistor — low power, audio frequency
      D: transistor — power, audio frequency
      E: diode — tunnel
      F: transistor — low power, high frequency
      G: several dissimilar devices, or miscellaneous (an oscillator, for one)
      H: diode — magnetic-field sensitive
      L: transistor — power, high frequency
      N: photocoupler
      P: radiation detector, such as a phototransistor
      Q: radiation generator, such as a light-emitting diode
      R: control and switching device, such as a low-power thyristor
      S: transistor — low power, switching
      T: control and switching device, such as a power thyristor
      U: transistor — power, switching
      X: diode — multiplier, such as a varactor or step-recovery diode
      Y: diode — rectifier or booster
      Z: diode — voltage reference or regulator
    # The family a letter implies, where it implies one. The transistor letters do not: BF245 is a JFET
    # and BC548 a bipolar transistor, both "transistor, low power".
    families: {A: signal-diode, B: varactor, E: tunnel-diode, X: varactor, Y: rectifier, Z: zener}
  range:
    label: range letter
    meaning: 'a letter before a two-figure serial number: the industrial and professional range (Z, Y, X, W and so on)'
  serial:
    label: serial number
    meaning: 'the number of this particular design; it says nothing about its properties'
  tolerance:
    label: voltage tolerance
    values:
      A: '±1 % (E96 series)'
      B: '±2 % (E48 series)'
      C: '±5 % (E24 series)'
      D: '±10 % (E12 series)'
      E: '±20 % (E6 series)'
  vz:
    label: working voltage
    meaning: 'the zener voltage, V standing for the decimal point: 5V6 is 5.6 V'
  grade:
    label: suffix
    meaning: 'not Pro Electron: a selection group the maker adds — a gain band for a transistor (onsemi''s BC547A, B and C), a drain-current band for a JFET'
    optional: true
  group:
    label: selection group
    meaning: 'a group the maker adds after a hyphen, usually a gain band; the maker''s sheet gives its range'
caveats:
  - The code says what a type number was registered as, not who made the part in your hand; many makers sold the same number.
  - Not every European number follows the code, and it covers discrete devices only; integrated circuits were numbered on a different plan.
refs: [S15, S14, S87, S29]
