# Where a part's data sheet is catalogued by the manufacturer that publishes it, and what the catalogue
# page says about the part in the manufacturer's own terms: the category it files the part under, its
# production status, and the title and revision of the data sheet. `pidx datasheets register` reads
# them into data/datasheets/datasheets.csv, facts and links only — the page's own prose stays on the page.
#
# Only parts this index already holds are asked for: the census says which parts a catalogue lists, the
# index says which of those anybody printed, and asking for the other sixteen thousand would cost the
# manufacturer's server without telling a reader anything.
# status: proposed | active | paused | blocked
ti_products:
  maker: texas-instruments
  census: ti_datasheets
  page: 'https://www.ti.com/product/{part}'
  status: active
  delay: 1.5
  keep: 250_000                 # the data sheet link sits 60-100 KB into a long page (ATL431: 61.5 KB)
  notes: 'robots.txt allows /product/ with Crawl-delay 1; read on 2026-09-27 at one page every 1.5 s.
    A product page carries its category, status and part number in meta tags and the data sheet as a
    link whose text is its title and revision. A part TI no longer has a page for answers 404 and is
    recorded as such.'
renesas_products:
  maker: renesas
  census: renesas_products
  page: 'https://www.renesas.com/en/products/{lower}'
  status: paused
  keep: 0                      # the status and breadcrumb sit 225 KB into the page: keep all of it
  notes: 'robots.txt allows ClaudeBot and anthropic-ai by name, with no crawl delay; read at the default
    one page every three seconds. The product page gives the breadcrumb (its last step is the category),
    a status label, the product''s title and the data sheet link — named only "Datasheet", so the data
    sheet has no title of its own here and the product''s title is kept as the name.
    Paused 2026-09-27: every page, the first included, answers 429 with cf-mitigated: challenge — a
    Cloudflare bot challenge, not a complaint about pace. Try again later; never solve it.'
onsemi_docs:
  kind: document sitemap
  maker: onsemi
  sitemaps:
    - https://www.onsemi.com/sitemap_com_documents_1.xml
    - https://www.onsemi.com/sitemap_com_documents_2.xml
    - https://www.onsemi.com/sitemap_com_documents_3.xml
    - https://www.onsemi.com/sitemap_com_documents_4.xml
  keep: '/download/data-sheet/pdf/'
  strip: '-d$'                   # bc546-d.pdf is the sheet whose first part is BC546
  status: active
  delay: 10                      # robots.txt: Crawl-delay 10
  notes: 'The document sitemaps list 6,449 data sheets (and application notes, which are not read here).
    robots.txt allows /download/ and asks for ten seconds between requests. A sheet''s file name is its
    first part; the sheet says which others it covers.'
nxp_docs:
  kind: document sitemap
  maker: nxp
  sitemaps:
    - https://www.nxp.com/sitemaps/sitemap_en_collateral.xml.gz
  keep: '/docs/en/data-sheet/'
  status: active
  delay: 3
  notes: 'The collateral sitemap lists 4,707 data sheets under /docs/en/data-sheet/, named after their
    first part. robots.txt allows them and names no delay; read at the default three seconds.'
that_datasheets:
  kind: document page
  maker: that
  pages:
    - https://thatcorp.com/ic-product-datasheets/
    - https://thatcorp.com/archived-datasheets/
  keep: '/datashts/[^/]+\.pdf$'
  all: true                      # 34 sheets: read them all
  strip: '^THAT_|_Datasheet$|data$'
  split: '[_-]'                  # THAT_1606-1646 is first the 1606
  prefix: THAT                   # the sheets write "THAT 1646" and "1646"; the index, THAT1646
  series: 3                      # the 1240 series is 1240, 1243, 1246; the 1250 is another product
  own_only: true                 # a sheet names the parts it pairs with (1570 -> 1510) on its first page
  status: active
  delay: 3
  notes: 'robots.txt allows everything. Two pages, current and archived data sheets, link every sheet
    under /datashts/ (34 on 2026-09-27).'
jj_datasheets:
  kind: document page
  maker: jj-electronic
  pages:
    - https://www.jj-electronic.com/en/download
  keep: '/images/stories/product/(preamplifying|power|rectifying)_tubes/.+\.pdf$'
  all: true                      # 36 tube sheets; the capacitor catalogues and amplifier manuals are left
  own_only: true                 # a tube sheet covers the types in its file name (el34_e34l) and no other
  status: active
  delay: 3
  notes: 'robots.txt disallows only the Joomla system folders. The download page links every tube sheet;
    a sheet names its type and, for EL34/E34L, both.'
linearsystems_datasheets:
  kind: product pages
  maker: linear-systems
  sitemaps:
    - https://www.linearsystems.com/sitemap.xml
  sitemaps_keep: 'dynamic-(jfet|bipolar|mosfets|dmos|currentregulating|lowleakage|voltagecontrolled|bifet)'
  pages_keep: 'linearsystems\.com/[a-z-]+/[a-z0-9-]+$'
  sheet_link: '<a [^>]*href="(https://www\.linearsystems\.com/_files/ugd/[^"]+\.pdf)"[^>]*aria-label="Datasheet"'
  title_strip: '\s*(Series)?\s*(\|.*)?$'
  keep: '/_files/ugd/[^/]+\.pdf$'
  all: true                      # about 70 products
  own_only: true                 # the LSK489 sheet names the LSK389 to compare with it
  titles: false                  # the PDF title fields are copied from other sheets (LS350's says ID100)
  status: active
  delay: 3
  notes: 'A Wix site: robots.txt allows everything but lightboxes. The product-collection sitemaps name
    each product page; the page links its data sheet as the button labelled "Datasheet" (its SPICE model
    is another PDF button, not taken), and its title names the part. PDF names are hashes.'
diotec_products:
  kind: catalogue
  maker: diotec
  status: active
  delay: 3
  notes: 'robots.txt disallows only the CMS folders. /en/all-products.html links 23 product families;
    /request/family/<FAM>/products/en is the table each family page draws: the article, its data sheet
    and its life cycle. A column lists competitors'' names the maker cross-references — not its parts,
    not read.'
toshiba_parametric:
  kind: catalogue
  maker: toshiba
  status: active
  delay: 3
  notes: 'robots.txt allows /parametric/ and /info/docget.jsp and names no delay. The parametric search
    page carries its menu (68 tables, 8 of them the not-recommended and discontinued lists); getHeaderData
    and getRowData give each table. The data sheet is a docget link, which answers with the dated PDF.
    Parts whose discontinuation is complete (2SC1815) are gone from every table.'
infineon_tables:
  kind: catalogue
  maker: infineon
  status: active
  delay: 3
  notes: 'robots.txt allows *.json and /assets/row/public/, and names no delay. The row sitemap names 930
    product tables; each family table''s JSON gives its parts, family, ordering-code status and data sheet.
    Tables built from a collection answer empty.'
st_wayback:
  kind: wayback
  maker: stmicroelectronics
  prefixes:
    - www.st.com/resource/en/datasheet/
  keep: '/resource/en/datasheet/[^/]+\.pdf$'
  status: active
  delay: 3
  notes: 'st.com closes the connection on anything but a browser, so its own address cannot be read. The
    Internet Archive has captured its data sheet addresses (11,525 on 2026-09-27, 7,344 distinct files);
    web.archive.org publishes no robots rules and its CDX API is made for this. Each sheet is read from the
    archived copy; ST''s own address is what is linked, with the copy beside it.'
adi_wayback:
  kind: wayback
  maker: analog-devices
  prefixes:
    - www.analog.com/media/en/technical-documentation/data-sheets/
  keep: '/data-sheets/[^/]+\.pdf$'
  status: active
  delay: 3
  notes: 'analog.com closes the connection on anything but a browser. The Internet Archive holds 23,224
    captures under its data sheet folder (17,157 addresses), which covers Linear Technology, Maxim and
    Hittite sheets too. Linear Technology''s numeric names (1028fd.pdf) name no part and are left.'
vishay_gateways:
  kind: catalogue
  maker: vishay
  gateways: [diodes, mosfets, analog-switches, optocouplers, photo-detectors, power-ics, solid-state-relays, ir-receiver-modules, leds]
  status: active
  delay: 3
  notes: 'robots.txt disallows only /search, /marcom and record views for general agents. The sitemap
    names a third of the products; the gateway pages list them all in their page data (docid and part
    numbers). Only products naming a known part are asked for further: the product page gives the data
    sheet and its category.'
nisshinbo_products:
  kind: catalogue
  maker: nisshinbo
  status: active
  delay: 3
  notes: 'robots.txt disallows *.pdf and *.csv for every agent, and nothing else of use here. The English
    page sitemap names 1,317 product pages after their product; each page''s download block links the
    data sheet. The link is published; the PDF is never fetched.'
secos_products:
  kind: catalogue
  maker: secos
  categories: [ic/lvr, ic/avr, ic/ldo, ic/asr, ic/aa, ic/oa, ic/com, ic/pho, diode/sr, diode/sr/lvf, diode/sr/sic,
               diode/gr, diode/fr, diode/sf, diode/sf/llsf, diode/he, diode/ss/sky, diode/ss/swt, diode/ss/pin,
               diode/br, diode/br/ns, diode/zd, diode/tvs, diode/tvs/esd, transistor/dt, transistor/mos,
               transistor/sst, transistor/mpt, thyristor/sil]
  status: active
  delay: 3
  notes: 'SeCoS (Taiwan). robots.txt allows everything. The site''s own script asks /api/product/<category>
    for a whole category at once — each part and its data sheet; the categories are the ones that
    script names (read 2026-09-27).'
tsc_products:
  kind: catalogue
  maker: taiwan-semiconductor
  status: active
  delay: 3
  notes: 'www.taiwansemi.com has no robots.txt and services.taiwansemi.com allows everything. The product
    filter''s skeleton gives the category tree, and products_v2 each leaf with status, family and data
    sheet. Sheet names carry spaces and are published percent-encoded.'
tt_datasheets:
  kind: catalogue
  maker: tt-electronics
  products: [Semiconductors, RF Power MOSFETs, Optoelectronics]
  status: active
  delay: 3
  notes: 'TT Electronics (Semelab, Optek). No robots.txt. The data sheet search page asks
    /api/search/resource for type 8 and receives all 1,790 sheets in one page; a sheet''s name packs the
    parts it covers ("2N6766 IRF250", "BDX66 A,B,C").'
kexin_products:
  kind: catalogue
  maker: kexin
  ca_issuer: http://crt.sectigo.com/SectigoPublicServerAuthenticationCADVR36.crt
  status: active
  delay: 3
  notes: 'Kexin. robots.txt disallows /admin/, /api/, member and inquiry pages. /en/products
    carries the whole catalogue in its page data: 5,070 rows, each with its data sheet. The server omits
    the intermediate certificate, which is fetched from the address its certificate names.'
