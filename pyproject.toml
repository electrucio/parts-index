[project]
name = "parts-index"
version = "0.0.1"
description = "Open database for analog-audio electronics: schematic references by part number, SPICE models, datasheets and model verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
# Only `pidx migrate datasets` needs this, and only until the research datasets are
# distilled and deleted. Install with `uv sync --extra datasets`.
datasets = ["pyarrow>=15"]

[project.scripts]
pidx = "parts_index.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/electrucio/parts-index"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parts_index"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["private_web_spice_models", "private_material"]

[tool.ruff.lint]
# Real problems (pyflakes) and import hygiene, not style preferences: much of this code is a
# deliberate verbatim port and is not reformatted until a golden test covers it (CLAUDE.md rule 7).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/core/test_parts.py" = ["E731"]   # verbatim port; kept comparable to its original

[tool.pytest.ini_options]
testpaths = ["tests"]
