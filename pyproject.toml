[project]
name = "parts-index"
version = "0.0.1"
description = "Open database for analog-audio electronics: schematic references by part number, SPICE models, datasheets and model verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]

[project.scripts]
pidx = "parts_index.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/electrucio/parts-index"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parts_index"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["private_uncommitted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
